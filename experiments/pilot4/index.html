<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DCCON Pilot 4</title>
  <style>
    :root { color-scheme: light; --ink: #202829; --muted: #526561; --line: #d2dfd9; --accent: #135344; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: #f3f7f4; font: 15px/1.55 system-ui, sans-serif; }
    header { background: #103d35; color: white; padding: 24px max(18px, calc((100vw - 1120px) / 2)); }
    h1 { margin: 0 0 4px; font-size: 28px; }
    h2 { margin: 0 0 12px; font-size: 18px; }
    p { margin: 0; }
    header p { color: #daebe5; }
    main { max-width: 1156px; margin: auto; padding: 18px; }
    section, #batch-panel { margin-bottom: 16px; }
    .panel { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
    #batch-panel > summary { font-weight: 650; }
    #batch-panel > form { margin-top: 12px; }
    .form-row { display: flex; gap: 8px; align-items: end; }
    label { display: grid; gap: 5px; font-weight: 650; flex: 1; }
    input, select, button { font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 7px; }
    input { min-width: 0; width: 100%; }
    #source-label { flex: 0 1 200px; }
    #cutoff-control { display: grid; grid-template-columns: auto minmax(80px, 260px) 3em; justify-content: start; align-items: center; gap: 10px; margin-top: 12px; }
    #cutoff { padding: 0; margin: 0; accent-color: var(--accent); }
    #cutoff-value { text-align: right; font-variant-numeric: tabular-nums; }
    button { color: white; background: var(--accent); border-color: var(--accent); cursor: pointer; font-weight: 650; }
    button:disabled { opacity: .5; cursor: default; }
    .status { color: var(--muted); margin-top: 10px; }
    .error { color: #a32730; }
    summary { cursor: pointer; }
    #batch-log { white-space: pre-wrap; overflow-wrap: anywhere; margin-bottom: 0; }
    #results { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; padding: 0; list-style: none; }
    .match { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px; min-width: 0; }
    .match:first-child { border-color: var(--accent); }
    .match-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .rank { font-weight: 750; color: var(--accent); }
    .score { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); }
    .match img { display: block; width: 100%; height: 88px; object-fit: contain; margin: 5px 0 8px; }
    .title { color: var(--muted); font-size: 12px; }
    .example { margin: 4px 0; font-weight: 650; overflow-wrap: anywhere; }
    .match details { font-size: 13px; }
    .match details ol { padding-left: 22px; }
    .match details li { margin-bottom: 3px; overflow-wrap: anywhere; }
    @media (max-width: 840px) { #results { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 590px) { #results { grid-template-columns: repeat(2, minmax(0, 1fr)); } .form-row { flex-wrap: wrap; } }
  </style>
</head>
<body>
  <header>
    <h1>DCCON Pilot 4</h1>
    <p>채팅 예문으로 찾는 디시콘 · 정지 이미지 16개와 GIF 16개</p>
  </header>
  <main>
    <details id="batch-panel" class="panel">
      <summary>Qwen 비전 배치</summary>
      <form id="batch">
        <div class="form-row">
          <label>Groq API 키<input id="key" type="password" placeholder="gsk_…" autocomplete="off" spellcheck="false"></label>
          <button id="generate" disabled>32개 생성 또는 재개</button>
        </div>
      </form>
      <p class="status" id="batch-status" role="status">배치 상태를 확인하는 중입니다.</p>
      <details id="batch-details" hidden><summary>배치 기록</summary><pre id="batch-log"></pre></details>
    </details>
    <section class="panel" aria-labelledby="search-heading">
      <h2 id="search-heading">32개 전체 순위</h2>
      <form id="search">
        <div class="form-row">
          <label>내가 보낼 말<input id="query" maxlength="300" placeholder="나 오늘 씻을 힘도 없음" required></label>
          <label id="source-label">예문 출처<select id="source" disabled><option value="">불러오는 중</option></select></label>
          <button id="search-button" disabled>전체 순위 보기</button>
        </div>
        <div id="cutoff-control">
          <label for="cutoff">유사도 컷오프</label>
          <input id="cutoff" type="range" min="0" max="1" step="0.01" value="0" aria-valuetext="끄기">
          <output id="cutoff-value" for="cutoff">끄기</output>
        </div>
      </form>
      <p class="status" id="search-status" role="status"></p>
    </section>
    <ol id="results" aria-label="디시콘 전체 순위"></ol>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const element = (tag, text, className) => {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;
      return node;
    };
    let ready = false;
    let searching = false;
    let lastSearch = null;
    let searchId = 0;
    let cutoffTimer;

    async function request(url, payload) {
      const options = payload && {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload),
      };
      const response = await fetch(url, options);
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "요청에 실패했습니다.");
      return data;
    }

    function setStatus(id, message, error = false) {
      $(id).textContent = message;
      $(id).classList.toggle("error", error);
    }

    async function updateStatus() {
      try {
        const {state, lines, configured, model, sources, source_errors: sourceErrors} = await request("./api/status");
        const previous = $("source").value;
        const options = Object.entries(sources).map(([key, label]) => new Option(label, key));
        ready = options.length > 0;
        $("source").replaceChildren(...(ready ? options : [new Option("준비된 예문 없음", "")]));
        if (sources[previous]) $("source").value = previous;
        $("source").disabled = !ready || searching;
        $("generate").disabled = $("key").disabled = state === "running" || state === "ready";
        if (configured) $("key").placeholder = "비워 두면 서버에 설정된 키 사용";
        $("search-button").disabled = !ready || searching;
        $("batch-details").hidden = !lines.length;
        $("batch-log").textContent = lines.join("\n");
        const status = {
          idle: `${model}로 이미지 주석과 콘당 예문 30개를 생성합니다.`,
          running: lines.at(-1) || "이미지 태깅을 시작하는 중입니다.",
          ready: `디시콘 32개 · 예문 960개 · ${model}`,
          failed: "태깅 배치를 완료하지 못했습니다. 배치 기록을 확인한 뒤 재개할 수 있습니다.",
        };
        setStatus("batch-status", status[state], state === "failed");
        if (!searching && !$("results").childElementCount) {
          const message = ready ? "" : sourceErrors.subagent || "예문 생성이 끝나면 검색할 수 있습니다.";
          setStatus("search-status", message, !ready && Boolean(sourceErrors.subagent));
        }
        if (state === "running") setTimeout(updateStatus, 1000);
      } catch (error) {
        setStatus("batch-status", error.message, true);
        $("generate").disabled = false;
      }
    }

    $("batch").addEventListener("submit", async event => {
      event.preventDefault();
      $("generate").disabled = true;
      try {
        await request("./api/generate", {api_key: $("key").value});
        $("key").value = "";
        await updateStatus();
      } catch (error) {
        setStatus("batch-status", error.message, true);
        $("generate").disabled = false;
      }
    });

    function showMatch(row, source) {
      const card = element("li", undefined, "match");
      const heading = element("div", undefined, "match-head");
      const score = element("span", `${row.score.toFixed(3)} · ${row.included}/30개`, "score");
      score.title = "유사도 합계 · 합산된 예문 수";
      heading.append(element("span", `${row.rank}위`, "rank"), score);
      const image = element("img");
      image.src = `./sticker/${source}/${encodeURIComponent(row.id)}`;
      image.alt = [row.package_title, row.title].filter(Boolean).join(" · ");
      const details = element("details");
      const examples = element("ol");
      examples.append(...row.examples.map(text => element("li", text)));
      details.append(element("summary", "생성 예문 30개"), examples);
      card.append(heading, image, element("p", image.alt || row.id, "title"),
                  element("p", row.best_example ?? "컷오프를 통과한 예문 없음", "example"), details);
      return card;
    }

    $("source").addEventListener("change", () => {
      clearTimeout(cutoffTimer);
      lastSearch = null;
      $("results").replaceChildren();
      setStatus("search-status", "");
    });

    $("cutoff").addEventListener("input", () => {
      const cutoff = $("cutoff").valueAsNumber;
      const label = cutoff ? cutoff.toFixed(2) : "끄기";
      $("cutoff-value").textContent = label;
      $("cutoff").setAttribute("aria-valuetext", label);
      clearTimeout(cutoffTimer);
      if (lastSearch) cutoffTimer = setTimeout(rank, 120);
    });

    async function rank() {
      if (!lastSearch || !ready) return;
      const id = ++searchId;
      const cutoff = $("cutoff").valueAsNumber || null;
      searching = $("search-button").disabled = true;
      $("source").disabled = true;
      setStatus("search-status", "예문 유사도를 계산하는 중입니다.");
      try {
        const {matches, source} = await request("./api/search", {...lastSearch, cutoff});
        if (id !== searchId || cutoff !== ($("cutoff").valueAsNumber || null)) return;
        $("results").replaceChildren(...matches.map(row => showMatch(row, source)));
        const label = $("source").selectedOptions[0].textContent;
        const rule = cutoff === null ? "예문 30개 합산" : `유사도 ${cutoff.toFixed(2)} 이상 합산`;
        setStatus("search-status", `${label} · ${matches.length}개 · ${rule}`);
      } catch (error) {
        if (id === searchId) setStatus("search-status", error.message, true);
      } finally {
        if (id === searchId) {
          searching = false;
          $("search-button").disabled = !ready;
          $("source").disabled = !ready;
        }
      }
    }

    $("search").addEventListener("submit", event => {
      event.preventDefault();
      if (!ready || searching) return;
      clearTimeout(cutoffTimer);
      lastSearch = {query: $("query").value, source: $("source").value};
      $("results").replaceChildren();
      rank();
    });

    updateStatus();
  </script>
</body>
</html>
