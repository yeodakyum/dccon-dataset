<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디시콘 검색 비교</title>
<style>
  :root { font-family: system-ui, sans-serif; color: #24281f; background: #f4f5ef; }
  * { box-sizing: border-box; }
  body { max-width: 1120px; margin: auto; padding: clamp(18px, 5vw, 56px); }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: clamp(29px, 5vw, 48px); letter-spacing: -.055em; margin: 0 0 14px; }
  h2 { font-size: 1.24rem; margin: 26px 0 12px; }
  h3 { font-size: 1rem; margin: 0; }
  #counts, .hint, small { color: #565e50; font-size: .82rem; }
  form, .method { background: #fffefa; border: 1px solid #dce0d4; border-radius: 14px; }
  form { padding: 18px; }
  label { display: block; font-weight: 650; margin-bottom: 5px; }
  input, textarea { width: 100%; padding: 10px 12px; font: inherit; color: inherit;
    border: 1px solid #cbd3c4; background: white; border-radius: 8px; margin-bottom: 13px; }
  textarea { resize: vertical; }
  button { background: #244b36; color: white; font: inherit; font-weight: 650;
    border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .method { padding: 14px; margin-bottom: 10px; }
  .method > header { align-items: center; margin-bottom: 10px; }
  .cards { list-style: none; display: grid; grid-template-columns: repeat(5, minmax(115px, 1fr));
    gap: 8px; padding: 0 0 4px; margin: 0; overflow-x: auto; }
  .card { border: 1px solid #e0e4d8; padding: 8px; border-radius: 9px; min-width: 0; }
  .preview { height: 94px; display: grid; place-items: center; background: #eef0e8; border-radius: 5px; }
  img { max-width: 100%; max-height: 94px; object-fit: contain; }
  .rank { display: flex; justify-content: space-between; align-items: baseline; margin-top: 5px; gap: 4px; }
  .card details { margin-top: 5px; }
  summary { cursor: pointer; color: #274e39; font-size: .82rem; }
  .evidence, code { display: block; white-space: pre-wrap; overflow-wrap: anywhere;
    font-size: .8rem; line-height: 1.45; margin: 5px 0; }
  .generated { margin: 0 0 12px; padding: 7px 9px; background: #eef0e8; border-radius: 6px; }
  .message { color: #565e50; margin: 0; font-size: .88rem; }
  .error { color: #8d3543; }
  :focus-visible { outline: 2px solid #29694a; outline-offset: 2px; }
</style>
<main>
  <header><h1>디시콘 검색 비교</h1><span id="counts" aria-live="polite"></span></header>
  <form>
    <label for="draft">보낼 말</label>
    <input id="draft" required placeholder="됐어 ㅋㅋ">
    <label for="context">최근 대화 <small>선택</small></label>
    <textarea id="context" rows="3" placeholder="친구: 파일 복구했어? 다시 보내줄까?"></textarea>
    <button type="submit" disabled>검색 비교</button>
  </form>
  <div id="results"></div>
</main>
<script>
const form = document.querySelector('form');
const submit = form.querySelector('button');
const results = document.querySelector('#results');
let settings;

const methods = [
  ['examples', '채팅 예문', '보낼 말 ↔ 콘과 함께 보낼 법한 말'],
  ['situations', '사용 상황', '보낼 말 ↔ 기존 주석의 상황·추천 이유·태그'],
  ['fused', '예문 + 상황 + 이미지 문구', '예문·상황 순위를 합치고 이미지 문구가 일치하면 가산'],
  ['context', '최근 대화 + 보낼 말', '두 입력을 붙여 사용 상황 검색'],
  ['descriptions', '기존 이미지 설명', '보낼 말 ↔ 외형·이미지 문구·태그'],
  ['image', '이미지 임베딩', '보낼 말 ↔ 원본 이미지 · SigLIP 2']
];
const slmMethods = [
  ['intent', 'SLM 의도 → 사용 상황', '로컬 모델이 만든 반응 의도로 상황 검색'],
  ['visual', 'SLM 표정·동작 → 이미지', '로컬 모델이 만든 시각 묘사로 원본 이미지 검색']
];

function element(tag, className = '', text = '') {
  const node = document.createElement(tag);
  node.className = className;
  node.textContent = text;
  return node;
}

fetch('/settings').then(response => {
  if (!response.ok) throw new Error();
  return response.json();
}).then(data => {
  settings = data;
  document.querySelector('#counts').textContent =
    `디시콘 ${data.count}개 · 예문 ${data.example_count}개 · 사용 상황 ${data.situation_count}개`;
  submit.disabled = false;
}).catch(() => {
  document.querySelector('#counts').textContent = '서버 설정을 읽을 수 없습니다.';
});

async function request(path, input) {
  const response = await fetch(path, {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(input)
  });
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || '검색에 실패했습니다.');
  return data;
}

function addGroup(title, definitions) {
  const group = element('section');
  group.append(element('h2', '', title));
  const panels = new Map();
  for (const [id, name, hint] of definitions) {
    const panel = element('section', 'method');
    const header = element('header');
    header.append(element('h3', '', name), element('span', 'hint', hint));
    const body = element('div');
    body.append(element('p', 'message', '검색 중…'));
    body.setAttribute('aria-live', 'polite');
    panel.append(header, body);
    group.append(panel);
    panels.set(id, body);
  }
  results.append(group);
  return panels;
}

function render(body, entry, generated = false) {
  body.replaceChildren();
  if (generated) {
    body.append(element('p', 'evidence generated', 'SLM이 만든 검색 문장 · ' + entry.query));
  }
  if (entry.embedding_input && (!generated || entry.embedding_input !== entry.query)) {
    const details = element('details');
    details.append(element('summary', '', '검색 입력 보기'), element('code', '', entry.embedding_input));
    body.append(details);
  }
  const cards = element('ol', 'cards');
  for (const match of entry.matches) {
    const card = element('li', 'card');
    const preview = element('div', 'preview');
    const image = document.createElement('img');
    image.loading = 'lazy';
    image.alt = '디시콘 ' + match.sticker_id;
    image.addEventListener('error', () => preview.replaceChildren(element('small', '', '이미지 없음')));
    image.src = '/sticker/' + encodeURIComponent(match.package_id) + '/' + encodeURIComponent(match.sticker_id);
    preview.append(image);
    const rank = element('div', 'rank');
    rank.append(element('strong', '', match.rank + '위'), element('small', '', '#' + match.sticker_id));
    card.append(preview, rank);
    const details = element('details');
    details.append(element('summary', '', '매칭 근거 보기'));
    for (const [field, label] of [
      ['example_text', '예문'], ['situation_text', '사용 상황'], ['ocr_match', '일치한 이미지 문구']
    ]) {
      if (match[field]) {
        const value = match.embedding_input && field !== 'ocr_match' ? match.embedding_input : match[field];
        details.append(element('p', 'evidence', label + ' · ' + value));
      }
    }
    if (match.embedding_input && !match.example_text && !match.situation_text) {
      details.append(element('code', '', match.embedding_input));
    }
    if (details.childElementCount > 1) card.append(details);
    cards.append(card);
  }
  body.append(cards);
}

form.addEventListener('submit', async event => {
  event.preventDefault();
  const input = {
    draft: document.querySelector('#draft').value.trim(),
    context: document.querySelector('#context').value.trim()
  };
  if (!settings || !input.draft) return;
  submit.disabled = true;
  results.replaceChildren();
  const local = addGroup('SLM 미사용', methods.filter(([id]) =>
    id !== 'image' || settings.image_count
  ));
  const enhanced = settings.ollama_model ? addGroup(
    'SLM 사용 · ' + settings.ollama_model,
    slmMethods.filter(([id]) => id !== 'visual' || settings.image_count)
  ) : new Map();

  try {
    const data = await request('/experiment', input);
    for (const [id, body] of local) {
      if (data[id]) render(body, data[id]);
      else body.replaceChildren(element('p', 'message', '최근 대화를 입력하면 비교할 수 있습니다.'));
    }
  } catch (error) {
    for (const body of local.values()) body.replaceChildren(element('p', 'message error', error.message));
  }
  await Promise.all([...enhanced].map(async ([id, body]) => {
    try {
      render(body, await request('/experiment/' + id, input), true);
    } catch (error) {
      body.replaceChildren(element('p', 'message error', error.message));
    }
  }));
  submit.disabled = false;
});
</script>
</html>
